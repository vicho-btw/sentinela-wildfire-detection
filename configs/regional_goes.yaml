defaults:
  data_root: data/goes_fire
  product: ABI-L2-MCMIPF
  sector: full_disk
  raw_channels:
    - CMI_C02
    - CMI_C03
    - CMI_C05
    - CMI_C06
    - CMI_C07
    - CMI_C11
    - CMI_C13
    - CMI_C14
    - CMI_C15
  derived_channels:
    - C07_minus_C13
    - C07_minus_C14
    - C14_minus_C15
    - C13_temporal_delta_10m
    - C07_temporal_delta_10m
  derived_enabled_default: false
  last_years: 2
  patch_size: 64
  temporal_offsets_minutes: [-30, -20, -10, 0]
  temporal_tolerance_minutes: 15
  early_signal_minutes: 60

regions:
  south_america:
    bbox: [-82.0, -56.0, -34.0, 13.0]
